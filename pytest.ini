[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra
markers =
    unit: Unit Tests (Tiền xử lý & Tiêu chuẩn dữ liệu - 15 tests)
    leakage: Leakage Prevention Invariance Tests (Chống rò rỉ dữ liệu - 8 tests)
    parity: Model Parity & Determinism Tests (Nhất quán & đơn định - 12 tests)
    smoke: Integration & Pipeline Smoke Tests (Chạy thông suốt & Web App - 12 tests)
